substitutions:
  _SERVICE_NAME: 'voteredge-ai'
  _REGION: 'asia-south1'
  _IMAGE_NAME: 'voteredge-ai'
  _RUNTIME_SA_NAME: 'voteredge-sa'
  _GEMINI_SECRET_NAME: 'voteredge-gemini-key'
  _CORS_ORIGIN: ''

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$SHORT_SHA'
      - '.'
    id: 'build-image'

  # Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest'
    id: 'push-image-latest'

  # Push commit-specific tag used for deployment
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$SHORT_SHA'
    id: 'push-image-sha'

  # Deploy to Cloud Run with secrets from Secret Manager
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$SHORT_SHA'
      - '--platform=managed'
      - '--region=${_REGION}'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production,CORS_ORIGIN=${_CORS_ORIGIN}'
      - '--update-secrets=GEMINI_API_KEY=${_GEMINI_SECRET_NAME}:latest'
      - '--service-account=${_RUNTIME_SA_NAME}@$PROJECT_ID.iam.gserviceaccount.com'
    id: 'deploy-cloud-run'
    waitFor: ['push-image-latest', 'push-image-sha']

images:
  - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest'
  - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$SHORT_SHA'

timeout: '3600s'
